# Uses local project tools (uv run ...) so pre-commit is identical to CI.
# No version pinning here — the project's pyproject.toml pins the tools.
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint)
        entry: uv run ruff check
        args: [--fix]
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy
        args: [core, tests]
        language: system
        pass_filenames: false
