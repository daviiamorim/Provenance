[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-observatory"
version = "0.1.0"
description = "Evidence-chain analytics platform"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyarrow>=17,<19",
    "numpy>=2.0",
    "scipy>=1.14",
    # stage 5: persistence + API
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.2",
    "anthropic>=0.40",
]

[project.entry-points."data_observatory.plugins"]
tabular = "plugins.tabular:TabularPlugin"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # Pinned below 6.112 deliberately: starting from that release hypothesis ships
    # _native.cp313-win_amd64.pyd (Rust extension, no Authenticode signature).
    # WDAC policy {0283ac0f-fff1-49ae-ada1-8a933130cad6} blocks unsigned .pyd files
    # at kernel load time — the tests fail at collection with ImportError before
    # any test runs. 6.111.x is pure-Python and behaviourally identical for our
    # property-based tests. Do NOT bump past 6.111 without resolving the WDAC
    # policy first (see docs/DECISIONS.md). — 2026-07-24
    "hypothesis>=6.0,<6.112",
    "pre-commit>=3.8",
    # stage 5: API testing
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "plugins", "db", "api"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings — enforced by convention, not tooling
    "ANN",     # type annotations — mypy handles these
    "COM812",  # missing trailing comma — conflicts with ruff-format
    "ISC001",  # implicit string concat — conflicts with ruff-format
    "EM101",   # string literal in exception — concise error messages are fine
    "EM102",   # f-string in exception
    "TRY003",  # long exception messages
    "TD",      # TODO/FIXME comments
    "FIX",     # fixme markers
    "TCH001",  # move import to TYPE_CHECKING — we need runtime types
    "TCH002",
    "TCH003",
    "PLR0913", # too many arguments — factory methods legitimately need many
    "RUF012",  # mutable class variable annotation — we use __init__ instead
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert — required by pytest
    "PLR2004", # magic value comparisons — expected in test assertions
    "SLF001",  # private member access — tests may inspect internals
]
"scripts/**" = [
    "T201",    # print — expected in CLI scripts
    "BLE001",  # broad exception catch — intentional for graceful demo output
    "INP001",  # implicit namespace package — scripts/ has no __init__.py
    "E402",    # imports after sys.stdout.reconfigure + load_dotenv — intentional ordering
    "PLR2004", # HTTP 200 is a conventional magic number in smoke tests
]
"db/migrations/**" = [
    "INP001",  # namespace package — Alembic generates this structure
    "ANN",     # annotations — Alembic template doesn't enforce them
]
"db/pipeline.py" = [
    "BLE001",  # broad exception catch — intentional: skip failing capabilities gracefully
    "S110",    # try/except/pass — intentional for plugin capability errors
    "C901",    # complexity — pipeline orchestration is inherently a sequence of steps
    "PLR0912", # too many branches — same reason
    "PLR0915", # too many statements — same reason
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

# Migration scripts use Alembic internals that are difficult to type in strict mode.
[[tool.mypy.overrides]]
module = "db.migrations.*"
ignore_errors = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=plugins --cov=db --cov=api --cov-report=term-missing -q"

[tool.coverage.run]
source = ["core", "plugins", "db", "api"]
omit = ["tests/*", "db/migrations/*"]
